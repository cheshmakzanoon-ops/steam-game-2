name: Create preproduction-v1 tag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-preproduction-tag.yml

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable preproduction-v1 tag
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 016c22d2d44be9168627e6045626ab0e097a35e5
          TAG_NAME: preproduction-v1
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          code="$(curl -sS -o /tmp/tag.json -w '%{http_code}'             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "${api}/git/ref/tags/${TAG_NAME}")"

          if [ "${code}" = "200" ]; then
            existing="$(jq -r '.object.sha' /tmp/tag.json)"
            if [ "${existing}" != "${TARGET_SHA}" ]; then
              echo "Tag already exists at unexpected SHA: ${existing}" >&2
              exit 1
            fi
            echo "Tag already exists at required SHA."
            exit 0
          fi

          if [ "${code}" != "404" ]; then
            cat /tmp/tag.json >&2
            exit 1
          fi

          curl --fail-with-body -sS -X POST             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "${api}/git/refs"             -d "$(jq -n --arg ref "refs/tags/${TAG_NAME}" --arg sha "${TARGET_SHA}" '{ref:$ref,sha:$sha}')"

          verify="$(curl --fail-with-body -sS             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "${api}/git/ref/tags/${TAG_NAME}" | jq -r '.object.sha')"

          test "${verify}" = "${TARGET_SHA}"
          echo "Verified ${TAG_NAME} -> ${verify}"
