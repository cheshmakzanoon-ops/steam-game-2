name: Phase 011 inspect editor normalization
on:
  push:
    branches: [main]
    paths: [.github/workflows/phase-011-inspect-editor.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Inspect exact project changes without committing them
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          git clone --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"
          git checkout --detach "$GITHUB_SHA"
          archive="$RUNNER_TEMP/godot.zip"
          curl --fail --location --silent --show-error "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$archive"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/editor"
          godot="$RUNNER_TEMP/editor/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$godot"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libegl1 libegl-mesa0 libgles2
          icd="$(find /usr/share/vulkan/icd.d -name '*lvp*.json' -print -quit)"
          export VK_DRIVER_FILES="$icd" VK_ICD_FILENAMES="$icd"
          "$godot" --headless --editor --path game --import
          xvfb-run -a -s '-screen 0 1280x720x24' "$godot" --rendering-method gl_compatibility --rendering-driver opengl3_es --disable-vsync --editor --path game --audio-driver Dummy --quit-after 60
          echo '=== EDITOR-NORMALIZED PROJECT ==='
          cat game/project.godot
          echo '=== EXACT SOURCE DELTA ==='
          git diff -- game/project.godot
          git status --porcelain
