name: Phase 011 clean-checkout acceptance
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase-011-bootstrap-check.yml
      - game/**
      - tools/**
      - toolchain.json
      - .gitattributes
      - .gitignore
permissions:
  contents: read
jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Fresh clone of the exact candidate
        run: |
          set -euo pipefail
          git clone --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse preproduction-v1^{commit})" = "016c22d2d44be9168627e6045626ab0e097a35e5"
          echo "SOURCE_ROOT=$RUNNER_TEMP/source" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/evidence"
      - name: Download pinned tools and verify publisher checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          python - <<'PY'
          import hashlib,json,os,platform,re,stat,subprocess,sys,tarfile,urllib.request,zipfile
          from pathlib import Path
          root=Path(os.environ['SOURCE_ROOT'])
          temp=Path(os.environ['RUNNER_TEMP'])
          tool_dir=temp/'bootstrap-tools'; tool_dir.mkdir()
          evidence=temp/'evidence'
          m=json.loads((root/'toolchain.json').read_text())
          def text(url, authenticated=False):
              headers={'User-Agent':'charterwake-phase011-verification'}
              if authenticated:
                  headers['Authorization']='Bearer '+os.environ['GH_TOKEN']
                  headers['Accept']='application/vnd.github+json'
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=120) as response:
                  return response.read().decode('utf-8')
          def download(url, target, expected):
              if not re.fullmatch(r'[0-9a-f]{64}',expected):
                  raise RuntimeError('Missing/invalid publisher SHA256; refusing unchecked download')
              h=hashlib.sha256()
              request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; CharterwakeBuild/1.0)', 'Referer':'https://www.blender.org/'})
              with urllib.request.urlopen(request,timeout=120) as response, target.open('wb') as out:
                  while chunk:=response.read(1024*1024):
                      h.update(chunk);out.write(chunk)
              if h.hexdigest()!=expected: raise RuntimeError('Archive checksum mismatch: '+target.name)
              return h.hexdigest()
          release=json.loads(text(m['godot']['release_api'],True))
          if release['tag_name']!=m['godot']['release_tag'] or release['draft'] or release['prerelease']:
              raise RuntimeError('Wrong engine release')
          name='Godot_v4.7.2-stable_win64.exe.zip' if os.name=='nt' else 'Godot_v4.7.2-stable_linux.x86_64.zip'
          asset=next(a for a in release['assets'] if a['name']==name)
          digest=asset.get('digest','').removeprefix('sha256:')
          archive=tool_dir/name
          download(asset['browser_download_url'],archive,digest)
          with zipfile.ZipFile(archive) as z:
              for entry in z.namelist():
                  if not (tool_dir/entry).resolve().is_relative_to(tool_dir.resolve()):
                      raise RuntimeError('Unsafe archive path')
              z.extractall(tool_dir)
          godot=tool_dir/name.removesuffix('.zip')
          godot.chmod(godot.stat().st_mode|stat.S_IXUSR)
          version=subprocess.check_output([str(godot),'--version'],text=True).strip()
          report={'os':platform.platform(),'python':sys.version,'candidate':os.environ['GITHUB_SHA'],
                  'godot':{'version':version,'archive':name,'sha256':digest,'asset_id':asset['id']}}
          with open(os.environ['GITHUB_ENV'],'a') as env: env.write('GODOT_BIN='+str(godot)+'\n')
          (evidence/'tool-versions.json').write_text(json.dumps(report,indent=2)+'\n')
          if os.name!='nt':
              url=m['blender']['linux_archive']; bn=url.rsplit('/',1)[-1]
              sums=text(m['blender']['checksums_url'])
              lines=[line for line in sums.splitlines() if line.strip().endswith(bn)]
              if len(lines)!=1: raise RuntimeError('Pinned Blender checksum missing/ambiguous')
              bd=lines[0].split()[0]; ba=tool_dir/bn; download(url,ba,bd)
              with tarfile.open(ba) as tf: tf.extractall(tool_dir,filter='data')
              blender=tool_dir/bn.removesuffix('.tar.xz')/'blender'
              bv=subprocess.check_output([str(blender),'--version'],text=True).strip()
              print(bv)
              expression="import bpy,json; print('BLENDER_VERSION_JSON='+json.dumps(list(bpy.app.version)))"
              probe=subprocess.check_output([str(blender),'--background','--factory-startup','--python-expr',expression],text=True,timeout=120)
              values=[json.loads(line.split('=',1)[1]) for line in probe.splitlines() if line.startswith('BLENDER_VERSION_JSON=')]
              if values!=[[int(part) for part in m['blender']['version'].split('.')]]:
                  raise RuntimeError('Wrong Blender numeric version: '+repr(values))
              report['blender']={'version':bv,'numeric_version':values[0],'archive':bn,'sha256':bd}
          else:
              report['blender']={'execution':'Not required on Windows for this asset-free bootstrap; Linux validates the authoring pin.'}
          (evidence/'tool-versions.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Prior preproduction regressions
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          for phase_script in phase-004/verify_rules.py phase-005/verify_scope.py phase-008/verify_roadmap.py phase-009/verify_risks.py phase-010/verify_preproduction.py; do
            python -S "docs/$phase_script" --self-test
          done
      - name: Headless clean import, main scene, probe and failure cases
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          python tools/verify_bootstrap.py --godot "$GODOT_BIN" --check-history --self-test --report "$RUNNER_TEMP/evidence/headless.json"
          rm -rf game/.godot
          python tools/verify_bootstrap.py --godot "$GODOT_BIN" --check-history --report "$RUNNER_TEMP/evidence/cache-recovery.json"
      - name: GUI editor and rendered scene on Linux
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools libegl1 libegl-mesa0 libgles2
          icd="$(find /usr/share/vulkan/icd.d -name '*lvp*.json' -print -quit)"
          test -n "$icd"
          export VK_DRIVER_FILES="$icd"
          export VK_ICD_FILENAMES="$icd"
          dpkg-query -W mesa-vulkan-drivers > "$RUNNER_TEMP/evidence/graphics-driver.txt"
          xvfb-run -a -s '-screen 0 1280x720x24' python tools/verify_bootstrap.py --godot "$GODOT_BIN" --visual --capture "$RUNNER_TEMP/evidence/boot.png" --report "$RUNNER_TEMP/evidence/visual.json"
      - name: Confirm no source changed or leaked generated files
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          status="$(git status --porcelain)"
          test -z "$status" || { printf '%s\n' "$status"; exit 1; }
          git diff --check
          echo "CLEAN_CHECKOUT_VERIFIED: $GITHUB_SHA; source unchanged after import, boot and cache recovery."
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: phase-011-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 14
